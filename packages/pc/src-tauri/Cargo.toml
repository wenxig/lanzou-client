cargo-features = ["trim-paths", "profile-rustflags"]

[package]
name = "lanzou-client"
description = ""
authors = ["wenxig"]
license = "AGPL-3.0-only"
repository = "https://github.com/delta-comic/delta-comic"
edition = "2024"
rust-version = "1.94.0"
version = "0.0.1"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = true
rustflags = ["-Zthreads=8"] # 提高编译性能。

[profile.dev.package."*"]
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
debug = false
incremental = true
trim-paths = "all"                           # 从您的二进制文件中移除潜在的特权信息。
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"] # 提高编译性能。

[lib]
name = "lanzou_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri-plugin-persisted-scope = "2.3.6"
tauri-plugin-fs = "2.5.0"
tokio = "1.52.1"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
log = "0.4.29"
tauri-runtime-wry = "2.10.0"
tauri-plugin-shell = "2"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26.1"


[dependencies.tauri-plugin-log]
version = "2.8.0"
features = ["colored"]

[dependencies.tauri-plugin-better-cors-fetch]
git = "https://github.com/delta-comic/tauri-plugin-better-cors-fetch"
branch = "main"
features = ["multipart", "blocking", "native-tls-vendored"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.tauri]
version = "2.10.2"
features = []

[build-dependencies.tauri-build]
version = "2.5.5"
features = []

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
